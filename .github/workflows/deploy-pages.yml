name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      # GitHub Pages maps /<repository>/ to the artifact root. Vinext writes
      # prefixed static assets under that repository directory, so flatten the
      # assets while retaining their public /<repository> URLs.
      - name: Normalize static asset paths for Pages
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [ -d "dist/client/${repository}/_next" ]; then
            mv "dist/client/${repository}/_next" "dist/client/_next"
            rmdir "dist/client/${repository}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
